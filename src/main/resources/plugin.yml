  inventory:
    description: P"ermet de voir l'inventaire d'un joueur"
    permission: oramiplugs.inventory
    aliases:
    - invsee
    - inventaire
    - inv
    usage: "§7[§c§lOramiPlugs§7] §e/inventory <Player>"
    permission-message: "§7[§c§lOramiPlugs§7] §cVous n'avez pas la permission d'utiliser cette commande."
  enderchest:
    description: "Permet de voir son enderchest ou celui d'un autre joueur"
