  clear:
    description: "Permet de supprimer son inventaire ou celui d'un autre joueur"
    permission: oramiplugs.clear
    usage: "§7[§c§lOramiPlugs§7] §e/clear [Player]"
    permission-message: "§7[§c§lOramiPlugs§7] §cVous n'avez pas la permission d'utiliser cette commande."
  kill:
    description: "Permet de tuer un joueur"
    permission: oramiplugs.kill
    usage: "§7[§c§lOramiPlugs§7] §e/kill <Player>"
    permission-message: "§7[§c§lOramiPlugs§7] §cVous n'avez pas la permission d'utiliser cette commande."
  msg:
    description: "Permet de communiquer entre deux joueur sans que d'autre personne ne le vois"
    aliases:
    - m
    - message
    usage: "§7[§c§lOramiPlugs§7] §e/msg <Player> <Message>"
    permission-message: "§7[§c§lOramiPlugs§7] §cVous n'avez pas la permission d'utiliser cette commande."
