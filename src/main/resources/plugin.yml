name: OramiPlugs
version: 1.0.1
main: fr.niastiik.oramiplugs.Main
api-version: 1.21
author: Niastiik
description: Plugin de base OramiPlugs
commands:
  heal:
    description: "Permet de remplire la barre de vie"
    permission: oramiplugs.heal
    usage: "§7[§c§lOramiPlugs§7] §e/heal [Player]"
    permission-message: "§7[§c§lOramiPlugs§7] §cVous n'avez pas la permission d'utiliser cette commande."
  feed:
    description: "Permet de remplire la barre de nourriture"
    permission: oramiplugs.feed
    usage: "§7[§c§lOramiPlugs§7] §e/feed [Player]"
    permission-message: "§7[§c§lOramiPlugs§7] §cVous n'avez pas la permission d'utiliser cette commande."
  day:
    description: "Permet de mettre le jour"
    permission: oramiplugs.day
    aliases:
    - jour
    usage: "§7[§c§lOramiPlugs§7] §e/day"
    permission-message: "§7[§c§lOramiPlugs§7] §cVous n'avez pas la permission d'utiliser cette commande."
  night:
    description: "Permet de mettre la nuit"
    permission: oramiplugs.night
    aliases:
    - nuit
    usage: "§7[§c§lOramiPlugs§7] §e/night"
    permission-message: "§7[§c§lOramiPlugs§7] §cVous n'avez pas la permission d'utiliser cette commande."
  broadcast:
    description: "Permet de faire une annonce"
    permission: oramiplugs.broadcast
    aliases:
    - bc
    - alert
    - brc
    usage: "§7[§c§lOramiPlugs§7] §e/broadcast <Message>"
    permission-message: "§7[§c§lOramiPlugs§7] §cVous n'avez pas la permission d'utiliser cette commande."
  information:
    description: "Permet de donner les infos d'un joueur"
    permission: oramiplugs.info
    aliases:
    - i
    - info
    usage: "§7[§c§lOramiPlugs§7] §e/information <Player>"
    permission-message: "§7[§c§lOramiPlugs§7] §cVous n'avez pas la permission d'utiliser cette commande."
  suicide:
    description: "Permet de ce suicider"
    usage: "§7[§c§lOramiPlugs§7] §e/suicide"
  sun:
    description: P"ermet de mettre un beau soleil"
    permission: oramiplugs.sun
    aliases:
    - soleil
    usage: "§7[§c§lOramiPlugs§7] §e/sun"
