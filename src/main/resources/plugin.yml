  tp:
    description: "Permet de se teleporte à un autre joueur"
    permission: oramiplugs.tp
    usage: "§7[§c§lOramiPlugs§7] §e/tp <Player>"
    permission-message: "§7[§c§lOramiPlugs§7] §cVous n'avez pas la permission d'utiliser cette commande."
  craft:
    description: "Permet d'ouvrir une table de craft"
    permission: oramiplugs.craft
    usage: "§7[§c§lOramiPlugs§7] §e/craft"
    permission-message: "§7[§c§lOramiPlugs§7] §cVous n'avez pas la permission d'utiliser cette commande."
  spawn:
    description: "Permet de se téléporter au spawn de la map"
    usage: "§7[§c§lOramiPlugs§7] §e/spawn"
  trade:
    description: "Permet de faire des échanges de stuff"
    usage: "§7[§c§lOramiPlugs§7] §e/trade"
  repair:
    description: "Permet de réparer son stuff"
    usage: "§7[§c§lOramiPlugs§7] §e/repair [all]"