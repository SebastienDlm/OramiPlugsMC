  gamemode:
    description: "Permet de changer de gamemode"
    permission: oramiplugs.gamemode
    aliases:
    - gm
    usage: "§7[§c§lOramiPlugs§7] §e/gamemode <Mode> [Player]"
    permission-message: "§7[§c§lOramiPlugs§7] §cVous n'avez pas la permission d'utiliser cette commande."
  vanish:
    description: éPermet de se faire cacher des autres joueur"
    permission: oramiplugs.vanish
    aliases:
    - v
    usage: "§7[§c§lOramiPlugs§7] §e/vanish"
    permission-message: "§7[§c§lOramiPlugs§7] §cVous n'avez pas la permission d'utiliser cette commande."
  freeze:
    description: "Permet de freeze un joueur"
    permission: oramiplugs.freeze
    usage: "§7[§c§lOramiPlugs§7] §e/freeze <Player>"
    permission-message: "§7[§c§lOramiPlugs§7] §cVous n'avez pas la permission d'utiliser cette commande."
  report:
    description: "Permet de signaler un joueur"
    aliases:
    - signale
    usage: "§7[§c§lOramiPlugs§7] §e/report <Player>"
  kick:
    description: "Permet d'expulser un joueur"
    permission: oramiplugs.kick
    usage: "§7[§c§lOramiPlugs§7] §e/kick <Player> <Message>"
    permission-message: "§7[§c§lOramiPlugs§7] §cVous n'avez pas la permission d'utiliser cette commande."
  god:
    description: "Permet de devenir invincible ou de rendre un joueur invincible"
    permission: oramiplugs.god
    usage: "§7[§c§lOramiPlugs§7] §e/god [Player]"
